name: 每日刷新估值数据

on:
  schedule:
    # 工作日 18:05 北京时间（10:05 UTC），A股收盘后抓取当日数据
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 触发线上刷新（等待全部指数抓取完成）
        run: |
          curl -fsS -X POST --max-time 1500 \
            https://index-valuation.onrender.com/api/refresh -o refresh-result.json
          python3 -c "import json;d=json.load(open('refresh-result.json'))['data'];bad={k:v for k,v in d.items() if not v.startswith(('ok','skip'))};print('指数数:',len(d),'失败:',bad)"

      - name: 下载最新 SQLite 到仓库
        run: |
          mkdir -p db
          curl -fsS --retry 3 --max-time 300 \
            https://index-valuation.onrender.com/api/admin/db -o db/valuation.db

      - name: 提交数据文件（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/valuation.db
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 每日估值数据刷新 $(date -u +%F)"
          git push
