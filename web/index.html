<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指数估值看板 · PE/PB 十年百分位</title>
<style>
  :root {
    --low: #2e9e5b; --mid-low: #7cb342; --mid-high: #f0a030; --high: #d9453a;
    --bg: #f4f6f9; --card: #fff; --text: #1f2329; --muted: #8a919e; --line: #e8ebf0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; }
  .meta { color: var(--muted); font-size: 12px; }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button:hover { background: #eef1f5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: box-shadow .15s; border: 1px solid var(--line); }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.07); }
  .card.active { outline: 2px solid #3b6ef0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-size: 15px; font-weight: 600; }
  .zone { font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; }
  .composite { font-size: 30px; font-weight: 700; margin: 6px 0 2px; }
  .composite small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .gauge { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--low) 0 20%, var(--mid-low) 20% 50%, var(--mid-high) 50% 80%, var(--high) 80% 100%); position: relative; margin: 8px 0 4px; opacity: .35; }
  .gauge .pin { position: absolute; top: -3px; width: 4px; height: 14px; background: #1f2329; border-radius: 2px; transform: translateX(-2px); }
  .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .row b { color: var(--text); font-weight: 600; }
  .warn { margin-top: 8px; font-size: 12px; color: #b26a00; background: #fdf3e0; border-radius: 8px; padding: 6px 8px; line-height: 1.5; }
  .type-tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 1px 6px; font-weight: 400; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); cursor: pointer; color: #5a6270; transition: all .12s; }
  .chip:hover { border-color: #c3cbd8; }
  .chip.on { background: #1f2329; color: #fff; border-color: #1f2329; }
  .chip.off { opacity: .38; cursor: not-allowed; background: transparent; }
  .chip.off:hover { border-color: var(--line); }
  .chip .n { opacity: .55; margin-left: 3px; }
  .fblock { display: flex; gap: 6px; align-items: center; }
  .flabel { font-size: 12px; color: var(--muted); margin-right: 2px; }
  select, input[type=search] { font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); font-family: inherit; }
  input[type=search] { width: 120px; }
  .count { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; grid-column: 1 / -1; padding: 18px; }
  .detail h2 { font-size: 16px; margin-bottom: 4px; }
  .detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  #chart { display: block; width: 100%; height: 240px; }
  .chart-box { position: relative; }
  .tip { position: absolute; display: none; pointer-events: none; z-index: 3; background: #fff; color: #111827;
    border: 1px solid #ccd3de; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.2);
    padding: 6px 9px; font-size: 12px; line-height: 18px; white-space: nowrap; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  @media (max-width: 640px) { .composite { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>指数估值看板</h1>
      <div class="meta" id="meta">PE/PB 近10年百分位 · 盈利下滑动态权重修正</div>
    </div>
    <div>
      <span class="meta" id="dateInfo"></span>
      <button onclick="refreshData()">刷新数据</button>
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="empty">加载中…</div></div>
</div>

<script>
const ZONE_COLOR = { "低估": "var(--low)", "合理偏低": "var(--mid-low)", "合理偏高": "var(--mid-high)", "高估": "var(--high)" };
const pct = v => (v * 100).toFixed(1) + "%";
const CAT_LABEL = { all: "全部", broad: "宽基", strategy: "策略红利", industry: "行业" };
const ZONES = ["低估", "合理偏低", "合理偏高", "高估"];
let current = null, allData = [];
const state = { cat: "all", zone: "all", sort: "composite", q: "" };

async function load() {
  const res = await fetch("/api/indices");
  const { data } = await res.json();
  allData = data.filter(d => !d.error);
  document.getElementById("dateInfo").textContent = allData.length ? "数据日期 " + allData[0].date : "";
  renderFilters();
  apply();
  if (allData.length && !current) showDetail(allData[0].symbol);
}

function match(d, skip) {
  return (skip === "cat" || state.cat === "all" || d.category === state.cat)
    && (skip === "zone" || state.zone === "all" || d.zone === state.zone)
    && (skip === "q" || !state.q || d.name.includes(state.q));
}

function renderFilters() {
  document.getElementById("filters").innerHTML = `
    <div class="fblock" id="catBlock"></div>
    <div class="fblock" id="zoneBlock"></div>
    <div class="fblock">
      <select onchange="setF('sort', this.value)">
        <option value="composite"${state.sort === "composite" ? " selected" : ""}>综合分位 低→高</option>
        <option value="composite_desc"${state.sort === "composite_desc" ? " selected" : ""}>综合分位 高→低</option>
        <option value="pe"${state.sort === "pe" ? " selected" : ""}>PE 低→高</option>
        <option value="pb"${state.sort === "pb" ? " selected" : ""}>PB 低→高</option>
        <option value="name"${state.sort === "name" ? " selected" : ""}>名称</option>
      </select>
      <input id="q" type="search" placeholder="搜索指数" value="${state.q}" oninput="setF('q', this.value)">
    </div>`;
  renderChips();
}

function renderChips() {
  const catChips = Object.keys(CAT_LABEL).map(k => {
    const n = allData.filter(d => (k === "all" || d.category === k) && match(d, "cat")).length;
    return chipHtml("cat", k, CAT_LABEL[k], n);
  }).join("");
  const zoneChips = ["all", ...ZONES].map(z => {
    const n = allData.filter(d => (z === "all" || d.zone === z) && match(d, "zone")).length;
    return chipHtml("zone", z, z === "all" ? "全部区间" : z, n);
  }).join("");
  document.getElementById("catBlock").innerHTML = `<span class="flabel">类别</span>${catChips}`;
  document.getElementById("zoneBlock").innerHTML = `<span class="flabel">区间</span>${zoneChips}`;
}

function chipHtml(group, key, label, n) {
  const on = state[group] === key;
  const off = n === 0 && !on;
  const cls = "chip" + (on ? " on" : "") + (off ? " off" : "");
  const click = off ? "" : ` onclick="setF('${group}','${key}')"`;
  return `<span class="${cls}"${click}>${label}<span class="n">${n}</span></span>`;
}

function setF(k, v) {
  state[k] = v;
  renderChips();
  apply();
}

function apply() {
  let list = allData.filter(d => match(d, null));
  const sorters = {
    composite: (a, b) => a.composite - b.composite,
    composite_desc: (a, b) => b.composite - a.composite,
    pe: (a, b) => a.pe_ttm - b.pe_ttm,
    pb: (a, b) => a.pb - b.pb,
    name: (a, b) => a.name.localeCompare(b.name, "zh"),
  };
  list.sort(sorters[state.sort] || sorters.composite);
  document.getElementById("count").textContent = `共 ${list.length} 个指数`;
  renderGrid(list);
}

function renderGrid(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  list.forEach(d => {
    const card = document.createElement("div");
    card.className = "card" + (current === d.symbol ? " active" : "");
    card.dataset.symbol = d.symbol;
    card.onclick = () => showDetail(d.symbol);
    const c = ZONE_COLOR[d.zone] || "#999";
    card.innerHTML = `
      <div class="card-head"><span class="name">${d.name} <small class="type-tag">${d.category_label} · ${d.type_label}</small></span>
        <span class="zone" style="background:${c}">${d.zone}</span></div>
      <div class="composite" style="color:${c}">${pct(d.composite)}<small>综合百分位</small></div>
      <div class="gauge"><div class="pin" style="left:${d.composite * 100}%"></div></div>
      <div class="row"><span>PE ${d.pe_ttm} · 百分位 <b>${pct(d.pe_percentile)}</b></span>
        <span>PB ${d.pb} · 百分位 <b>${pct(d.pb_percentile)}</b></span></div>
      <div class="row"><span>权重 PE <b>${pct(d.w_pe)}</b> / PB <b>${pct(d.w_pb)}</b></span>
        <span>盈利增速 <b>${d.earnings_g == null ? "--" : (d.earnings_g * 100).toFixed(1) + "%"}</b></span></div>
      ${d.history_years && d.history_years < 8 ? `<div class="warn">⚠ 历史仅 ${d.history_years} 年，百分位参考意义有限</div>` : ""}
      ${d.stale_days > 20 ? `<div class="warn">⚠ 行情滞后 ${d.stale_days} 天</div>` : ""}
      ${d.distorted ? '<div class="warn">⚠ 盈利走弱致 PE 被动抬高，已边际下调 PE 权重</div>' : ""}
    `;
    grid.appendChild(card);
  });
  if (!list.length) grid.innerHTML = '<div class="empty">没有符合筛选条件的指数</div>';
  placeDetail();
}

let detailCache = null;

async function showDetail(code) {
  if (current === code) {
    current = null;
    detailCache = null;
    apply();
    return;
  }
  current = code;
  apply();
  const res = await fetch("/api/indices/" + code);
  const d = await res.json();
  if (current !== code) return;
  detailCache = d;
  placeDetail();
}

function placeDetail() {
  document.querySelectorAll(".detail").forEach(n => n.remove());
  if (!current || !detailCache || detailCache.symbol !== current) return;
  const card = document.querySelector(`.card[data-symbol="${current}"]`);
  if (!card) return;
  const d = detailCache;
  const c = ZONE_COLOR[d.zone] || "#999";
  card.insertAdjacentHTML("afterend", `
    <div class="detail">
      <h2>${d.name} <span style="color:${c}">${pct(d.composite)}</span> <span class="zone" style="background:${c}">${d.zone}</span></h2>
      <div class="sub">${d.category_label} · ${d.type_label} · 近${d.history_years}年综合估值百分位走势（PE ${pct(d.w_pe)} / PB ${pct(d.w_pb)} 加权）· ${d.date}</div>
      <div class="chart-box"><svg id="chart"></svg><div id="tip" class="tip"></div></div>
      <div class="legend">
        <span><i style="background:#3b6ef0"></i>综合百分位</span>
        <span><i style="background:#e08a2e"></i>正常化PE口径</span>
        <span><i style="background:#c9d2e0"></i>指数点位(右轴)</span>
        <span><i style="background:var(--low)"></i>低估线 20%</span>
        <span><i style="background:var(--high)"></i>高估线 80%</span>
      </div>
      ${d.note ? `<div class="warn" style="margin-top:12px">⚠ ${d.note}</div>` : ""}
      <div class="stats">
        <div class="stat"><div class="k">PE(TTM)</div><div class="v">${d.pe_ttm}</div></div>
        <div class="stat"><div class="k">正常化PE(3年盈利)</div><div class="v">${d.pe_norm == null ? "--" : d.pe_norm}</div></div>
        <div class="stat"><div class="k">PE 百分位</div><div class="v">${pct(d.pe_percentile)}</div></div>
        <div class="stat"><div class="k">PB</div><div class="v">${d.pb}</div></div>
        <div class="stat"><div class="k">PB 百分位</div><div class="v">${pct(d.pb_percentile)}</div></div>
        <div class="stat"><div class="k">平滑盈利增速</div><div class="v" style="color:${d.earnings_g < 0 ? "var(--high)" : "var(--low)"}">${d.earnings_g == null ? "--" : (d.earnings_g * 100).toFixed(1) + "%"}</div></div>
        <div class="stat"><div class="k">收盘点位</div><div class="v">${d.close}</div></div>
        <div class="stat"><div class="k">指数类型</div><div class="v" style="font-size:14px">${d.type_label}</div></div>
        <div class="stat"><div class="k">PE基准→微调后</div><div class="v" style="font-size:14px">${pct(d.base_w_pe)} → ${pct(d.w_pe)}</div></div>
        <div class="stat"><div class="k">历史覆盖</div><div class="v" style="font-size:14px">${d.history_years} 年</div></div>
      </div>
    </div>`);
  drawChart(d.history);
  const el = card.nextElementSibling;
  if (el && el.getBoundingClientRect().top > window.innerHeight - 120) {
    window.scrollTo({ top: window.scrollY + card.getBoundingClientRect().top - 70, behavior: "smooth" });
  }
}

function drawChart(history) {
  const svg = document.getElementById("chart");
  const W = Math.max(320, Math.round(svg.clientWidth || 900));
  const H = Math.min(280, Math.max(170, Math.round(W * 0.34)));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.height = H + "px";
  const PL = 42, PR = 46, PT = 14, PB_ = 30;
  const iw = W - PL - PR, ih = H - PT - PB_;
  const n = history.length;
  if (n < 2) { svg.innerHTML = ""; return; }
  const xs = i => PL + (i / (n - 1)) * iw;
  const ys = v => PT + (1 - v) * ih;
  const closes = history.map(h => h.close);
  const cMin = Math.min(...closes), cMax = Math.max(...closes);
  const yc = v => PT + (1 - (v - cMin) / (cMax - cMin || 1)) * ih;

  let s = "";
  // 背景分区
  const bands = [[0, .2, "rgba(46,158,91,.07)"], [.2, .5, "rgba(124,179,66,.05)"], [.5, .8, "rgba(240,160,48,.06)"], [.8, 1, "rgba(217,69,58,.07)"]];
  bands.forEach(([a, b, col]) => { s += `<rect x="${PL}" y="${ys(b)}" width="${iw}" height="${ys(a) - ys(b)}" fill="${col}"/>`; });
  // 参考线
  [.2, .5, .8].forEach(v => {
    s += `<line x1="${PL}" x2="${W - PR}" y1="${ys(v)}" y2="${ys(v)}" stroke="#aab" stroke-dasharray="4 4" stroke-width="1"/>`;
    s += `<text x="${PL - 6}" y="${ys(v) + 4}" font-size="11" fill="#8a919e" text-anchor="end">${v * 100}%</text>`;
  });
  // 点位曲线
  s += `<polyline fill="none" stroke="#c9d2e0" stroke-width="1.5" points="` +
    history.map((h, i) => `${xs(i).toFixed(1)},${yc(h.close).toFixed(1)}`).join(" ") + `"/>`;
  // 正常化口径参考线（虚线）
  const normPts = history.map((h, i) => h.composite_norm == null ? null : `${xs(i).toFixed(1)},${ys(h.composite_norm).toFixed(1)}`)
    .filter(Boolean).join(" ");
  if (normPts) {
    s += `<polyline fill="none" stroke="#e08a2e" stroke-width="1.6" stroke-dasharray="5 4" points="${normPts}"/>`;
  }
  // 综合百分位曲线
  s += `<polyline fill="none" stroke="#3b6ef0" stroke-width="2" points="` +
    history.map((h, i) => `${xs(i).toFixed(1)},${ys(h.composite).toFixed(1)}`).join(" ") + `"/>`;
  // 端点
  const last = history[n - 1];
  s += `<circle cx="${xs(n - 1)}" cy="${ys(last.composite)}" r="4" fill="#3b6ef0"/>`;
  s += `<text x="${xs(n - 1) - 6}" y="${ys(last.composite) - 8}" font-size="12" fill="#3b6ef0" text-anchor="end" font-weight="600">${(last.composite * 100).toFixed(1)}%</text>`;
  // X轴年份刻度（窄屏只保留3个）
  const years = {};
  history.forEach((h, i) => { const y = h.date.slice(0, 4); if (!(y in years)) years[y] = i; });
  const yEntries = Object.entries(years);
  const maxLabels = W < 520 ? 3 : 6;
  let shown = yEntries.map((_, k) => k);
  if (yEntries.length > maxLabels) {
    shown = [];
    for (let k = 0; k < maxLabels; k++) shown.push(Math.round(k * (yEntries.length - 1) / (maxLabels - 1)));
  }
  shown.forEach(k => {
    const [y, i] = yEntries[k];
    s += `<text x="${xs(i)}" y="${H - 8}" font-size="11" fill="#8a919e" text-anchor="middle">${y}</text>`;
  });
  // 右轴点位刻度
  [cMin, (cMin + cMax) / 2, cMax].forEach(v => {
    s += `<text x="${W - PR + 6}" y="${yc(v) + 4}" font-size="11" fill="#aab">${Math.round(v)}</text>`;
  });
  svg.innerHTML = s + `<g id="cursor" style="display:none"></g>`;

  // 点按/滑动显示该位置数值
  const cursor = svg.querySelector("#cursor");
  const tip = document.getElementById("tip");
  const showAt = ev => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    const px = (ev.clientX - r.left) * (W / r.width);
    let i = Math.round(((Math.min(Math.max(px, PL), W - PR)) - PL) / iw * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const h = history[i], x = xs(i), y = ys(h.composite);
    cursor.innerHTML =
      `<line x1="${x}" x2="${x}" y1="${PT}" y2="${H - PB_}" stroke="#3b6ef0" stroke-dasharray="3 3" stroke-width="1"/>` +
      `<circle cx="${x}" cy="${y}" r="3.5" fill="#3b6ef0"/>`;
    cursor.style.display = "";
    tip.innerHTML = `<div>${h.date}</div><div>综合 ${(h.composite * 100).toFixed(1)}%</div>` +
      (h.composite_norm == null ? "" : `<div>正常化 ${(h.composite_norm * 100).toFixed(1)}%</div>`) +
      `<div>点位 ${Math.round(h.close)}</div>`;
    tip.style.display = "block";
    const sx = r.width / W;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = x * sx + 12;
    if (left + tw > r.width - 2) left = x * sx - tw - 12;
    if (left < 2) left = 2;
    let top = y - th - 12;
    if (top < 2) top = Math.min(y + 14, H - th - 2);
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  };
  let dragging = false;
  svg.style.touchAction = "pan-y";
  svg.onpointerdown = ev => {
    dragging = true;
    try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
    showAt(ev);
  };
  svg.onpointermove = ev => {
    if (dragging || ev.pointerType === "mouse") showAt(ev);
  };
  const stop = () => { dragging = false; };
  svg.onpointerup = stop;
  svg.onpointercancel = stop;
}

let rzTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    const svg = document.getElementById("chart");
    if (svg && detailCache) drawChart(detailCache.history);
  }, 150);
});

async function refreshData() {
  if (!confirm("从数据源重新拉取全部指数数据，约需1分钟，继续？")) return;
  await fetch("/api/refresh", { method: "POST" });
  location.reload();
}

load();
</script>
</body>
</html>
